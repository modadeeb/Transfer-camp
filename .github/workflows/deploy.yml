# Tests, migrates D1 and deploys the Worker on every push to main.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (optional: CLOUDFLARE_ACCOUNT_ID).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Check token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret in Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Build web
        run: npm run build

      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply camp --remote

      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy

      - name: Ensure JWT_SECRET exists
        working-directory: apps/api
        run: |
          if npx wrangler secret list --format json | grep -q '"JWT_SECRET"'; then
            echo "JWT_SECRET already set"
          else
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put JWT_SECRET
            echo "JWT_SECRET generated"
          fi
