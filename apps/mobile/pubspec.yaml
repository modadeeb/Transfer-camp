name: transfer_camp
description: معسكر نقلة — تطبيق الجوال.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  go_router: ^14.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
  fonts:
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/PlexArabic-400.ttf
          weight: 400
        - asset: assets/fonts/PlexArabic-500.ttf
          weight: 500
        - asset: assets/fonts/PlexArabic-600.ttf
          weight: 600
        - asset: assets/fonts/PlexArabic-700.ttf
          weight: 700
    - family: PlexLatin
      fonts:
        - asset: assets/fonts/PlexLatin-400.ttf
          weight: 400
        - asset: assets/fonts/PlexLatin-500.ttf
          weight: 500
        - asset: assets/fonts/PlexLatin-600.ttf
          weight: 600
        - asset: assets/fonts/PlexLatin-700.ttf
          weight: 700
